name: ESP32-C3 Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build ESP32-C3 with ESP-IDF v5.3.6
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.6
          target: esp32c3
          path: '.'
          command: |
            rm -f sdkconfig sdkconfig.old
            idf.py set-target esp32c3

            grep -q '^CONFIG_IDF_TARGET="esp32c3"$' sdkconfig
            grep -q '^CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y$' sdkconfig

            idf.py build
            idf.py merge-bin -o esp32_serial_ble_bridge-C3-full.bin -f raw

      - name: Archive ESP32-C3 firmware
        uses: actions/upload-artifact@v6
        with:
          name: esp32-c3-firmware
          if-no-files-found: error
          retention-days: 7
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32_serial_ble_bridge.bin
            build/esp32_serial_ble_bridge-C3-full.bin
            build/flash_args
            build/flasher_args.json